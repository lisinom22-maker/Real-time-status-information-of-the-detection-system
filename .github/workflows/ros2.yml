name: ROS2 Humble build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep python3-pyqt5 python3-psutil python3-pytest
          source /opt/ros/humble/setup.bash
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then rosdep init; fi
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src --rosdistro humble -r -y
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select status_interfaces status_publisher
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --packages-select status_interfaces status_publisher --event-handlers console_direct+
          colcon test-result --verbose
